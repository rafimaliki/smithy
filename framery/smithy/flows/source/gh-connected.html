<!doctype html><meta charset=utf-8><style>
:root{--bg:#131517;--side:#1a1b1d;--rail:#1a1b1d;--line:#27282b;--ink:#dbdbdb;--mute:#80848a;--acc:#70949e;--sel:#26282b;--hov:#222224;--k:#8ba0b6;--s:#a8bc96;--f:#98bdc8;--t:#9fb9b8;--c:#515660;--add:#81b88b;--del:#c74e39}
*{box-sizing:border-box;margin:0}html,body{width:1440px;height:900px;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:7px;height:26px;color:var(--ink);white-space:nowrap}
.row:hover{background:var(--hov)}.row.active{background:var(--sel)}
.chev{color:var(--mute);flex:none;margin-right:-2px}
.nm{flex:1}.mod{width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:12px;flex:none;display:inline-block}
.ic{flex:none;display:inline-flex;align-items:center;justify-content:center}
.ic.box{width:16px;height:16px;border-radius:4px;font:700 8px/1 "Segoe UI";color:#14161a}
.ic.txt{width:18px;font:700 10px/1 "JetBrains Mono","Cascadia Mono",Consolas,monospace;letter-spacing:-.5px}
.ic.glyph{position:relative;width:14px;height:16px}.ic.glyph b{position:absolute;top:7px;left:0;right:0;text-align:center;font:700 6px/1 "Segoe UI"}
.editor{flex:1;overflow:hidden;padding-top:6px}
.ln{display:flex;height:21px;position:relative}
.num{width:56px;text-align:right;padding-right:18px;color:var(--mute);opacity:.6;font:12px/21px "JetBrains Mono","Cascadia Mono",Consolas,monospace}
.tx{white-space:pre;font:13px/21px "JetBrains Mono","Cascadia Mono",Consolas,monospace}.k{color:var(--k)}.s{color:var(--s)}.f{color:var(--f)}.t{color:var(--t)}
.g-add:before{content:"";position:absolute;left:46px;top:1px;bottom:1px;width:3px;border-radius:2px;background:var(--add)}
.tabs{display:flex}.tab{display:flex;align-items:center;gap:8px;height:100%;padding:0 14px;color:var(--mute)}.tab.active{color:var(--ink)}.tab .mod{margin:0 0 0 2px}

.main{flex:1;display:flex;min-height:0}
.rail{width:48px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;border-right:1px solid var(--line)}
.rail .b{width:48px;height:40px;display:grid;place-items:center;color:var(--mute);position:relative}.rail .b.on{color:var(--ink);box-shadow:inset 2px 0 var(--acc)}.rail .sp{flex:1}
.rail .bd{position:absolute;top:5px;right:6px;background:var(--acc);color:#10131a;font:700 9px/1 "Segoe UI";padding:2px 4px;border-radius:8px}
.side{width:300px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.side h6{font:600 11px/1 "Segoe UI";letter-spacing:.8px;color:var(--mute);padding:14px 14px 10px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{height:36px;background:var(--side);border-bottom:1px solid var(--line)}.tab.active{background:var(--bg);box-shadow:inset 0 1px var(--acc)}
.status{height:24px;background:var(--rail);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:18px;color:var(--mute);font-size:12px}.status .br{display:flex;gap:5px;align-items:center;color:var(--ink)}.status .r{margin-left:auto;display:flex;gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:transparent;font:inherit;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0f131a;font-weight:600}.btn.ico{width:24px;height:24px;padding:0;border:0;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg span{padding:4px 12px;color:var(--mute)}.seg .on{background:var(--sel);color:var(--ink)}
.sec{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;font-weight:600;font-size:12px;color:var(--ink)}.sec em{font-style:normal;margin-left:auto;background:var(--sel);border-radius:9px;padding:0 7px;color:var(--mute);font-weight:500}
.frow{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 22px;white-space:nowrap}.frow.active{background:var(--sel)}.frow .dir{color:var(--mute);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis}
.frow .act{display:flex;gap:0}.frow .s{width:16px;text-align:center;font:700 11px "Segoe UI"}.cnt{font:12px "JetBrains Mono","Cascadia Mono",Consolas,monospace}.cnt .a{color:var(--add)}.cnt .r{color:var(--del);margin-left:6px}
.msg{margin:0 12px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);height:64px;padding:8px 10px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-bottom:1px solid var(--line)}.bar .p{flex:1;color:var(--mute)}.bar .p b{color:var(--ink);font-weight:600}
.hunk{display:flex;align-items:center;height:28px;padding-left:14px;color:var(--mute);background:color-mix(in srgb,var(--acc) 10%,transparent);font:12px "JetBrains Mono","Cascadia Mono",Consolas,monospace}.hunk span{flex:1}.hunk .btn{height:22px;margin-right:8px;font:12px "Segoe UI"}
.d{display:flex;height:21px}.d .o,.d .n{width:44px;text-align:right;padding-right:8px;color:var(--mute);opacity:.7;font:12px/21px "JetBrains Mono","Cascadia Mono",Consolas,monospace;flex:none}.d .g{width:22px;text-align:center;font:13px/21px "JetBrains Mono","Cascadia Mono",Consolas,monospace;flex:none}
.d.add{background:color-mix(in srgb,var(--add) 14%,transparent)}.d.add .g{color:var(--add)}.d.del{background:color-mix(in srgb,var(--del) 14%,transparent)}.d.del .g{color:var(--del)}
.d mark{background:color-mix(in srgb,var(--add) 34%,transparent);color:inherit;border-radius:2px}.d.del mark{background:color-mix(in srgb,var(--del) 34%,transparent)}
.split{display:flex}.split>div{flex:1;min-width:0;border-right:1px solid var(--line)}.split>div:last-child{border:0}.d.empty{background:color-mix(in srgb,var(--mute) 8%,transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:12px;background:var(--sel);color:var(--ink)}.chip.g{background:color-mix(in srgb,var(--add) 22%,transparent);color:var(--add)}.chip.m{color:var(--mute)}
.sel{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 10px;margin:0 12px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.sel small{color:var(--mute);font-size:11px;margin-right:8px}
.prow{padding:9px 14px;border-bottom:1px solid var(--line)}.prow.active{background:var(--sel)}.prow .pt{display:flex;gap:8px;align-items:center}.prow .pt b{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .m{color:var(--mute);font-size:12px;margin-top:3px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.pane{flex:1;padding:36px 56px}.pane h1{font:600 20px/1.2 "Segoe UI";margin-bottom:6px}.hint{color:var(--mute)}
.field{width:560px;border:1px solid var(--line);border-radius:6px;background:var(--bg);height:34px;display:flex;align-items:center;padding:0 12px;font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;color:var(--mute)}
.card{width:640px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--side)}
.menu{position:absolute;left:12px;top:80px;width:276px;background:var(--side);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.45);padding:6px 0}
.menu .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px}.menu .it.on{background:var(--sel)}.menu .it small{margin-left:auto;color:var(--mute)}
</style><body><div class="main">
