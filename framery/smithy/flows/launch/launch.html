body{background:var(--bg);align-items:center;justify-content:center}.wrap{width:560px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}.brand b{font:600 30px/1 "Segoe UI";letter-spacing:.5px}.brand span{display:block;color:var(--mute);margin-top:4px}
