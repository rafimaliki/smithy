[package]
name = "smithy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
exclude = ["spike/gpui", "spike/egui"]

[dependencies]
gpui = "0.2.2"
pulldown-cmark = { version = "0.13", default-features = false }
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Syntax highlighting: one grammar per language, compiled in and loaded when a
# file of that type opens. `tree-sitter` is the runtime; the rest are grammars
# (tiny C files, no extra build tools beyond the MSVC one the app already needs).
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-dart = "0.2"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-md = "0.5"
tree-sitter-powershell = "0.26"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
