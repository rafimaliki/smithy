[package]
name = "smithy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
exclude = ["spike/gpui", "spike/egui"]

[dependencies]
gpui = "0.2.2"
pulldown-cmark = { version = "0.13", default-features = false }
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
